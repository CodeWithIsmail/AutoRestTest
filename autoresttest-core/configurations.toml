[spec]
location = "D:\\SPL3\\AutoRestTest\\engine-service\\jobs\\0075f793e3d94807ade7ef63965f39e8\\spec_a122c12e0ab19f8d.yaml"
recursion_limit = 50
strict_validation = false

[llm]
engine = "meta/llama-3.1-8b-instruct"
creative_temperature = 1
strict_temperature = 1
api_base = "https://integrate.api.nvidia.com/v1"
max_tokens = 4096
rpm_limit = 40

[agents.header]
enabled = false

[agent]
max_combinations = 12
max_total_combinations = 3000
base_samples_per_size = 200
combination_seed = 42

[agent.value]
parallelize = true
max_workers = 3

[cache]
use_cached_graph = true
use_cached_table = true

[export]
dependency_graph = true

[q_learning]
learning_rate = 0.1
discount_factor = 0.9
max_exploration = 1

[request_generation]
time_duration = 3600
mutation_rate = 0.2

[api]
override_url = false
host = "localhost"
port = 8080

[custom_headers]
Authorization = "Bearer ${JWT_TOKEN}"
