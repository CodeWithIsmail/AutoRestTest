  /v4/launches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get one launch
      tags: [Launches]
      responses:
        "200":
          description: Launch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericItem"
        "404":
          description: Not found
    patch:
      summary: Update a launch
      tags: [Launches]
      security:
        - spacexKey: []
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete a launch
      tags: [Launches]
      security:
        - spacexKey: []
      responses:
        "200":
          description: Deleted

  /v4/launches/query:
    post:
      summary: Query launches (supports pagination)
      tags: [Launches]
      requestBody:
        required: true
        content:
          application/json: {}
