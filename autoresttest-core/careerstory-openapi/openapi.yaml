openapi: "3.0.0"
info:
  title: SpaceX REST API
  version: "4.0.0"
  description: |
    Open-source SpaceX REST API (v4) — endpoints for launches, rockets, cores,
    payloads, launchpads, landpads, capsules, ships, dragons, starlink, roadster,
    company and history. Generated from repository routes and docs for testing.
servers:
  - url: https://api.spacexdata.com
    description: Official public API
components:
  securitySchemes:
    spacexKey:
      type: apiKey
      in: header
      name: spacex-key
  schemas:
    PaginationResult:
      type: object
      properties:
        totalDocs:
          type: integer
        limit:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
        docs:
          type: array
          items:
            type: object
    GenericItem:
      type: object
      description: Generic resource object
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
paths:
  /v4/launches:
    get:
      summary: Get all launches (v4)
      tags: [Launches]
      responses:
        "200":
          description: A list of launches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginationResult"
    post:
      summary: Create a launch
      tags: [Launches]
      security:
        - spacexKey: []
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        "201":
          description: Created
  /v5/launches:
    get:
      summary: Get all launches (v5)
